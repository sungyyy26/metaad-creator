<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Meta Ad Desk · 접근 불가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --primary:#a5ed6e; --on-primary:#111111; --bg:#ddf4ff; --surface:#ffffff;
    --text:#3c3c3c; --text-muted:#777777; --accent:#1cb0f6;
    --radius:12px;
    --font-display:"Baloo 2","Noto Sans KR",sans-serif;
    --font-body:"Noto Sans KR","Baloo 2",sans-serif;
    --shadow: 0 10px 0 -4px rgba(60,60,60,.08), 0 2px 18px rgba(60,60,60,.1);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); padding:20px;
    font-family:var(--font-body); word-break:keep-all; overflow-wrap:normal;
  }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  .card{
    width:100%; max-width:380px; background:var(--surface); border-radius:20px;
    box-shadow:var(--shadow); padding:40px 30px; text-align:center;
  }
  .mascot{ font-size:48px; line-height:1; margin-bottom:14px; }
  h1{ font-family:var(--font-display); font-weight:800; font-size:22px; margin:0 0 10px; color:var(--text); }
  p{ color:var(--text); font-size:14px; line-height:1.6; margin:0 0 4px; }
  .email{ font-weight:700; color:var(--text); }
  .request-btn{
    display:flex; align-items:center; justify-content:center; width:100%; min-height:48px;
    background:var(--primary); color:var(--on-primary); border:none; border-radius:var(--radius);
    padding:14px 20px; font-family:var(--font-display); font-weight:800; font-size:13px;
    letter-spacing:.5px; text-decoration:none; cursor:pointer; margin-top:24px;
    transition:transform 300ms ease, filter 300ms ease; box-shadow:0 4px 0 0 #7fc94f;
  }
  .request-btn:hover{ filter:brightness(1.04); }
  .request-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 0 #7fc94f; }
  .back-link{
    display:inline-block; margin-top:16px; color:var(--text-muted); font-weight:600;
    font-size:12px; text-decoration:underline;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mascot" aria-hidden="true">🦉</div>
    <h1>아직 접근 권한이 없어요</h1>
    <p><span class="email">{{ email }}</span> 계정은</p>
    <p>아직 허용된 계정 목록에 없습니다.</p>
    <a class="request-btn" href="/login/google?intent=request">접근 권한 요청하기</a>
    <br>
    <a class="back-link" href="/login">← 로그인 페이지로</a>
  </div>
</body>
</html>
