<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>광고 에딧 데스크 · 계정 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@600;700;800&family=Noto+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f0fa; --surface:#ffffff; --surface-2:#f4f2fa; --border:rgba(120,110,160,.22);
    --text:#18161d; --text-muted:#5b5768; --text-faint:#87839a;
    --accent:#0080ff; --accent-hover:#2f97ff; --accent-contrast:#ffffff;
    --error:#d70015;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 16px 32px -20px rgba(30,20,60,.2);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#131019; --surface:#1c1826; --surface-2:#242032; --border:rgba(255,255,255,.14);
      --text:#f3f1fa; --text-muted:#a9a6c0; --text-faint:#726f8a;
      --accent:#2997ff; --accent-hover:#5aabff; --accent-contrast:#ffffff;
      --error:#f87171;
      --shadow: 0 2px 10px rgba(0,0,0,.3), 0 16px 32px -20px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text); padding:40px 20px;
    font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  }
  .wrap{ max-width:560px; margin:0 auto; }
  h1{ font-family:"Gothic A1",sans-serif; font-weight:800; font-size:22px; margin:0 0 4px; }
  .sub{ color:var(--text-muted); font-size:13px; margin:0 0 28px; }
  .sub a{ color:var(--accent); font-weight:600; text-decoration:none; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:24px; margin-bottom:20px; }
  .card h2{ font-family:"Gothic A1",sans-serif; font-size:15px; margin:0 0 14px; }
  .admin-row{ display:flex; align-items:center; gap:8px; font-family:"IBM Plex Mono",monospace; font-size:13px; color:var(--text-muted); margin-bottom:16px; }
  .admin-row span{ background:var(--surface-2); border-radius:980px; padding:4px 12px; }
  form.add-form{ display:flex; gap:8px; }
  input[type=email]{
    flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; font-size:14px; color:var(--text); font-family:inherit;
  }
  button{
    font-family:"Gothic A1",sans-serif; font-weight:700; font-size:13px; border:none; border-radius:980px;
    padding:10px 18px; cursor:pointer; background:var(--accent); color:var(--accent-contrast); white-space:nowrap;
  }
  button:hover{ background:var(--accent-hover); }
  .list{ display:flex; flex-direction:column; gap:8px; }
  .list-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface-2); border-radius:10px; padding:10px 14px;
  }
  .list-row .email{ font-family:"IBM Plex Mono",monospace; font-size:13px; }
  .list-row .meta{ font-size:11px; color:var(--text-faint); }
  .del-btn{ background:transparent; color:var(--error); border:1px solid var(--error); padding:4px 12px; font-size:12px; }
  .del-btn:hover{ background:var(--error); color:#fff; }
  .empty{ color:var(--text-faint); font-size:13px; text-align:center; padding:16px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>계정 관리</h1>
    <p class="sub">여기서 추가한 이메일만 Google 로그인으로 들어올 수 있습니다. <a href="/">← 대시보드로</a></p>

    <div class="card">
      <h2>관리자 (항상 허용)</h2>
      <div class="admin-row"><span>{{ admin_email }}</span></div>
      <h2>계정 추가</h2>
      <form class="add-form" method="post" action="/admin/users/add">
        <input type="email" name="email" placeholder="example@boosters.kr" required>
        <button type="submit">추가</button>
      </form>
    </div>

    <div class="card">
      <h2>허용된 계정 ({{ allowed_users|length }}명)</h2>
      {% if allowed_users %}
      <div class="list">
        {% for u in allowed_users %}
        <div class="list-row">
          <div>
            <div class="email">{{ u.email }}</div>
            <div class="meta">{{ u.submittedAt }} 추가</div>
          </div>
          <form method="post" action="/admin/users/{{ u.email }}/delete" onsubmit="return confirm('{{ u.email }} 계정을 삭제할까요?');">
            <button type="submit" class="del-btn">삭제</button>
          </form>
        </div>
        {% endfor %}
      </div>
      {% else %}
      <div class="empty">관리자 외에 허용된 계정이 아직 없습니다.</div>
      {% endif %}
    </div>
  </div>
</body>
</html>
