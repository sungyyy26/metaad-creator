<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>광고 에딧 데스크 · 로그인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@600;700;800&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f0fa; --surface:#ffffff; --border:rgba(120,110,160,.22);
    --text:#18161d; --text-muted:#5b5768;
    --accent:#0080ff; --accent-hover:#2f97ff; --accent-contrast:#ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,.08), 0 20px 40px -20px rgba(30,20,60,.25);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#131019; --surface:#1c1826; --border:rgba(255,255,255,.14);
      --text:#f3f1fa; --text-muted:#a9a6c0;
      --accent:#2997ff; --accent-hover:#5aabff; --accent-contrast:#ffffff;
      --shadow: 0 2px 10px rgba(0,0,0,.3), 0 20px 40px -20px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); padding:24px;
    font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  }
  .card{
    width:100%; max-width:360px; background:var(--surface); border:1px solid var(--border);
    border-radius:20px; box-shadow:var(--shadow); padding:40px 32px; text-align:center;
  }
  h1{
    font-family:"Gothic A1",sans-serif; font-weight:800; font-size:22px; margin:0 0 6px;
  }
  p{ color:var(--text-muted); font-size:13px; margin:0 0 28px; line-height:1.5; }
  .google-btn{
    display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
    background:var(--accent); color:var(--accent-contrast); border:none; border-radius:980px;
    padding:13px 20px; font-family:"Gothic A1",sans-serif; font-weight:700; font-size:14px;
    text-decoration:none; cursor:pointer; transition:background .12s;
  }
  .google-btn:hover{ background:var(--accent-hover); }
  .google-btn svg{ width:18px; height:18px; flex:none; }
</style>
</head>
<body>
  <div class="card">
    <h1>광고 에딧 데스크</h1>
    <p>Boosters 팀 계정으로 로그인하면 계속 사용할 수 있습니다.</p>
    <a class="google-btn" href="/login/google">
      <svg viewBox="0 0 24 24"><path fill="#fff" d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12s3.36-7.27 7.19-7.27c3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.19 2C6.42 2 2.03 6.8 2.03 12s4.39 10 10.16 10c5.52 0 9.58-3.87 9.58-9.6 0-1.22-.18-1.9-.42-2.3z"/></svg>
      Google로 로그인
    </a>
  </div>
</body>
</html>
